
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hazra Hijab | Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f8f5f1; color: #443832;
      font-family: Arial, sans-serif;
    }
    header {
      background: #fff; padding: 22px;
      border-bottom: 1px solid #e8ddd5;
    }
    header h1 { margin: 0; letter-spacing: 2px; }
    main { max-width: 1000px; margin: 28px auto; padding: 16px; }
    .panel {
      background: white; border: 1px solid #eadfd7;
      border-radius: 16px; padding: 22px; margin-bottom: 22px;
    }
    input, textarea, button {
      width: 100%; padding: 12px; margin: 7px 0;
      border: 1px solid #d9ccc2; border-radius: 9px;
      font: inherit;
    }
    button {
      background: #765749; color: white; border: 0;
      cursor: pointer; font-weight: bold;
    }
    button.secondary { background: #e9ded6; color: #443832; }
    button.delete { background: #a33b3b; }
    .product {
      display: grid; grid-template-columns: 90px 1fr;
      gap: 14px; padding: 14px 0;
      border-bottom: 1px solid #eee4dd;
    }
    .product img {
      width: 90px; height: 100px; object-fit: cover;
      border-radius: 8px; background: #f3ece6;
    }
    .product p { margin: 5px 0; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
    .hidden { display: none; }
    #message { white-space: pre-wrap; }
    small { color: #756960; }
    @media (max-width: 520px) {
      main { padding: 10px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
<header>
  <h1>HAZRA HIJAB</h1>
  <p>Admin Dashboard</p>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>
    <p><small>Log masuk menggunakan akaun admin yang telah dicipta.</small></p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h2>Product Management</h2>
      <p id="message" role="status"></p>
      <button id="logout" class="secondary" type="button">Log Out</button>

      <form id="productForm">
        <input id="productId" type="hidden">

        <label for="name">Product name</label>
        <input id="name" placeholder="Elena Cotton Shawl" required>

        <label for="price">Price (RM)</label>
        <input id="price" type="number" min="0" step="0.01"
          placeholder="27.50" required>

        <label for="description">Description</label>
        <textarea id="description" placeholder="Product details"></textarea>

        <label for="colors">Colours (separate with commas)</label>
        <input id="colors" placeholder="Dusty Rose, Mocha, Oat">

        <label for="stock">Stock quantity</label>
        <input id="stock" type="number" min="0" step="1"
          value="0" required>

        <label for="image">Product image (JPEG, PNG or WebP, max 5 MB)</label>
        <input id="image" type="file"
          accept="image/jpeg,image/png,image/webp">

        <label>
          <input id="active" type="checkbox" checked
            style="width:auto;margin-right:8px">
          Product is active
        </label>

        <button type="submit">Save Product</button>
        <button id="cancelEdit" type="button" class="secondary hidden">
          Cancel Edit
        </button>
      </form>
    </div>

    <div class="panel">
      <h2>My Products</h2>
      <div id="productsList">Loading products...</div>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://zazanrjpgbdspfnpnjuw.supabase.co";
const SUPABASE_KEY = "sb_publishable_OclHWzrdrzvQgZiXhc4pPA_lNYxxfeq";

const client = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

const $ = id => document.getElementById(id);
const say = text => $("message").textContent = text;

function showDashboard(isLoggedIn) {
  $("loginPanel").classList.toggle("hidden", isLoggedIn);
  $("dashboard").classList.toggle("hidden", !isLoggedIn);
}

async function refreshSession() {
  const { data } = await client.auth.getSession();
  showDashboard(!!data.session);
  if (data.session) await loadProducts();
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  say("Logging in...");

  const { error } = await client.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  if (error) {
    say("Login failed: " + error.message);
    return;
  }

  $("password").value = "";
  showDashboard(true);
  say("Login successful.");
  await loadProducts();
});

$("logout").addEventListener("click", async () => {
  await client.auth.signOut();
  showDashboard(false);
  say("");
});

$("cancelEdit").addEventListener("click", resetForm);

function resetForm() {
  $("productForm").reset();
  $("productId").value = "";
  $("active").checked = true;
  $("cancelEdit").classList.add("hidden");
}

async function loadProducts() {
  $("productsList").textContent = "Loading...";

  const { data, error } = await client
    .from("products")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    $("productsList").textContent =
      "Could not load products: " + error.message;
    return;
  }

  $("productsList").replaceChildren();

  if (!data.length) {
    $("productsList").textContent =
      "No products yet. Add your first product above.";
    return;
  }

  data.forEach(product => {
    const row = document.createElement("div");
    row.className = "product";

    const img = document.createElement("img");
    img.alt = product.name;
    img.src = product.image_url || "";
    img.onerror = () => { img.style.visibility = "hidden"; };

    const details = document.createElement("div");
    const title = document.createElement("strong");
    title.textContent = product.name;

    const price = document.createElement("p");
    price.textContent = "RM " + Number(product.price).toFixed(2);

    const info = document.createElement("p");
    info.textContent = "Stock: " + product.stock +
      " · " + (product.is_active ? "Active" : "Hidden");

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.type = "button";
    edit.textContent = "Edit";
    edit.onclick = () => editProduct(product);

    const del = document.createElement("button");
    del.type = "button";
    del.textContent = "Delete";
    del.className = "delete";
    del.onclick = () => deleteProduct(product);

    actions.append(edit, del);
    details.append(title, price, info, actions);
    row.append(img, details);
    $("productsList").append(row);
  });
}

function editProduct(p) {
  $("productId").value = p.id;
  $("name").value = p.name || "";
  $("price").value = p.price;
  $("description").value = p.description || "";
  $("colors").value = (p.colors || []).join(", ");
  $("stock").value = p.stock;
  $("active").checked = p.is_active;
  $("image").value = "";
  $("cancelEdit").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  say("Saving product...");

  const { data: sessionData } = await client.auth.getSession();
  if (!sessionData.session) {
    showDashboard(false);
    say("Please log in again.");
    return;
  }

  const id = $("productId").value;
  const file = $("image").files[0];
  let imageUrl = "";

  if (file) {
    const allowed = ["image/jpeg", "image/png", "image/webp"];
    if (!allowed.includes(file.type) || file.size > 5 * 1024 * 1024) {
      say("Please use JPEG, PNG or WebP images up to 5 MB.");
      return;
    }

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "-");
    const path = Date.now() + "-" + safeName;

    const { error: uploadError } = await client.storage
      .from("product-images")
      .upload(path, file, { upsert: false });

    if (uploadError) {
      say("Image upload failed: " + uploadError.message);
      return;
    }

    const { data: publicData } = client.storage
      .from("product-images")
      .getPublicUrl(path);

    imageUrl = publicData.publicUrl;
  }

  const product = {
    name: $("name").value.trim(),
    description: $("description").value.trim(),
    price: Number($("price").value),
    colors: $("colors").value.split(",")
      .map(c => c.trim()).filter(Boolean),
    stock: Number($("stock").value),
    is_active: $("active").checked,
    updated_at: new Date().toISOString()
  };

  if (imageUrl) product.image_url = imageUrl;

  const result = id
    ? await client.from("products").update(product).eq("id", id)
    : await client.from("products").insert(product);

  if (result.error) {
    say("Save failed: " + result.error.message);
    return;
  }

  resetForm();
  say("Product saved successfully.");
  await loadProducts();
});

async function deleteProduct(p) {
  if (!confirm("Delete " + p.name + "?")) return;

  const { error } = await client
    .from("products").delete().eq("id", p.id);

  if (error) {
    say("Delete failed: " + error.message);
    return;
  }

  say("Product deleted.");
  await loadProducts();
}

client.auth.onAuthStateChange((_event, session) => {
  showDashboard(!!session);
});

refreshSession();
</script>
</body>
</html>
